name: Build and deploy itinerary

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule' || vars.GOOGLE_DOC_SYNC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm for lockfile reproducibility
        run: |
          npm install --global npm@11.12.1
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run data and static export checks
        run: npm run test:data
      - name: Read approved itinerary tab from Google Docs
        if: vars.GOOGLE_DOC_SYNC_URL != ''
        run: node scripts/google-doc-sync.mjs
        env:
          GOOGLE_DOC_SYNC_URL: ${{ vars.GOOGLE_DOC_SYNC_URL }}
      - name: Type check source and synchronized data
        run: npm run typecheck
      - name: Build static export for this Pages repository
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: Deghim/mi-itinerario
      - name: Verify built Pages artifact
        run: npm run test:export
        env:
          EXPECT_PAGES_BASE_PATH: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
